<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title, description, canonical, robots, Open Graph, X card and JSON-LD are generated per page
         from src/config/site.ts by scripts/prerender.mjs (build) or vite.config.ts (dev). -->
    <!--app-head-->

    <!-- Self-hosted variable Inter (one file, all weights): no third-party, render-blocking font CSS -->
    <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Apply the saved theme before first paint so dark-mode visitors don't see a white flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("kev-theme");
          if (t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>

    <link rel="icon" type="image/png" sizes="100x100" href="/kelvin-avatar.png" />
    <link rel="apple-touch-icon" href="/kelvin-avatar.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#fcfcfc" />
  </head>

  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
